name: Build & Deploy Frontend

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/movee-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.env_vars.outputs.IMAGE_TAG }}
      service_name: ${{ steps.env_vars.outputs.SERVICE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Set environment specific variables
        id: env_vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=frontend_prod" >> $GITHUB_OUTPUT
            echo "API_URL=$(doppler secrets get FRONTEND_API_URL_PROD --plain)" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=frontend_stg" >> $GITHUB_OUTPUT
            echo "API_URL=$(doppler secrets get FRONTEND_API_URL_STAGING --plain)" >> $GITHUB_OUTPUT
          fi
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.env_vars.outputs.API_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.env_vars.outputs.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch deployment secrets
        id: secrets
        run: |
          echo "SERVER_HOST=$(doppler secrets get SERVER_HOST --plain)" >> $GITHUB_OUTPUT
          echo "SERVER_USER=$(doppler secrets get SERVER_USER --plain)" >> $GITHUB_OUTPUT
          echo "DEPLOY_PATH=$(doppler secrets get DEPLOY_PATH --plain)" >> $GITHUB_OUTPUT
          echo "GHCR_PAT=$(doppler secrets get GHCR_PAT --plain)" >> $GITHUB_OUTPUT
          echo "GITHUB_ORG=$(doppler secrets get GITHUB_ORG --plain)" >> $GITHUB_OUTPUT
          echo "BOT_WEBHOOK_URL=$(doppler secrets get BOT_WEBHOOK_URL --plain)" >> $GITHUB_OUTPUT

          echo "SERVER_SSH_KEY<<SSHEOF" >> $GITHUB_OUTPUT
          doppler secrets get SERVER_SSH_KEY --plain >> $GITHUB_OUTPUT
          echo "SSHEOF" >> $GITHUB_OUTPUT
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.secrets.outputs.SERVER_HOST }}
          username: ${{ steps.secrets.outputs.SERVER_USER }}
          key: ${{ steps.secrets.outputs.SERVER_SSH_KEY }}
          envs: GHCR_PAT,GITHUB_ORG,DEPLOY_PATH,SERVICE_NAME
          script: |
            set -e
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ORG" --password-stdin
            cd $DEPLOY_PATH/devops
            docker compose -f docker-compose.prod.yml pull $SERVICE_NAME
            docker compose -f docker-compose.prod.yml up -d $SERVICE_NAME
            docker image prune -f
            echo "=== $SERVICE_NAME deployed ==="
        env:
          GHCR_PAT: ${{ steps.secrets.outputs.GHCR_PAT }}
          GITHUB_ORG: ${{ steps.secrets.outputs.GITHUB_ORG }}
          DEPLOY_PATH: ${{ steps.secrets.outputs.DEPLOY_PATH }}
          SERVICE_NAME: ${{ needs.build-and-push.outputs.service_name }}
          BOT_WEBHOOK_URL: ${{ steps.secrets.outputs.BOT_WEBHOOK_URL }}

      - name: Send Notification
        if: always()
        run: |
          curl -X POST ${{ steps.secrets.outputs.BOT_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "app": "Movee Frontend",
             "environment": "${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}",
            "status": "${{ job.status }}",
            "actor": "${{ github.actor }}",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
